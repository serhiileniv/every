name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # System Ruby (2.6) is the compatibility floor — test against it.
      - name: Syntax check
        run: /usr/bin/ruby -cw bin/every lib/every.rb lib/every/*.rb
      - name: Unit tests
        run: for f in test/*_test.rb; do echo "== $f =="; /usr/bin/ruby "$f" || exit 1; done
      # The unit tests only prove plist *generation*. This registers a real
      # launchd agent, runs it, pauses/resumes/removes it, and asserts
      # ~/Library/LaunchAgents is byte-identical afterwards.
      - name: End-to-end (real launchd)
        run: sh test/e2e/unix.sh "$PWD" "$RUNNER_TEMP/every-home"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: ruby -cw bin/every lib/every.rb lib/every/*.rb
      - name: Unit tests
        run: for f in test/*_test.rb; do echo "== $f =="; ruby "$f" || exit 1; done
      # Validate every generated OnCalendar expression with real systemd.
      # (Same script the `docker` workflow runs in a pinned container.)
      - name: systemd-analyze calendar validation
        run: ruby test/systemd_calendar_check.rb
      # A user bus is needed to register user timers. Without it the E2E still
      # runs and reports the lifecycle section as SKIP rather than passing it.
      - name: Enable a systemd user session
        run: |
          sudo loginctl enable-linger "$USER" || true
          systemctl --user show-environment || echo "no user bus — lifecycle will skip"
      - name: End-to-end (real systemd)
        run: sh test/e2e/unix.sh "$PWD" "$RUNNER_TEMP/every-home"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Syntax check
        shell: pwsh
        run: |
          $failed = 0
          ruby -cw bin/every
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          ruby -cw lib/every.rb
          if ($LASTEXITCODE -ne 0) { $failed = 1 }
          Get-ChildItem lib/every/*.rb | ForEach-Object {
            ruby -cw $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed
      - name: Unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = 0
          Get-ChildItem test/*_test.rb | ForEach-Object {
            Write-Host "== $($_.Name) =="
            ruby $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed
      - name: PowerShell installer syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: PowerShell installer checkout path
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "every-install"
          .\install.ps1 -Prefix $prefix
          if (-not (Test-Path (Join-Path $prefix "lib\every\bin\every"))) { throw "runtime was not staged under lib\every" }
          if (-not (Test-Path (Join-Path $prefix "bin\every.cmd"))) { throw "shim was not installed" }
          & (Join-Path $prefix "bin\every.cmd") version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\install.ps1 -Prefix $prefix -Uninstall

  # Windows against the REAL Task Scheduler service. The unit tests cover XML
  # and CSV shapes in isolation, which is how a PowerShell query that could
  # never match a task shipped in 0.3.0-rc. Installs first, so the every.cmd
  # shim branch of Runtime.bin is what gets exercised.
  windows-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install every
        shell: pwsh
        run: .\install.ps1 -Prefix "$env:RUNNER_TEMP\every"
      - name: End-to-end (real Task Scheduler)
        shell: pwsh
        run: pwsh -File test/e2e/windows.ps1 -Prefix "$env:RUNNER_TEMP\every"

  # The Linux install path (install.sh) — the one users curl. Exercised end to
  # end: install, run the installed binary, uninstall, and prove it left
  # nothing behind.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX sh lint
        run: shellcheck -s sh install.sh
      - name: Install (local checkout, user prefix)
        run: sh install.sh --prefix "$HOME/opt/every"
      - name: The installed every works
        run: |
          set -eux
          test -L "$HOME/opt/every/bin/every"
          "$HOME/opt/every/bin/every" version
          "$HOME/opt/every/bin/every" list
          test -f "$HOME/opt/every/lib/every/lib/every.rb"
          test -f "$HOME/opt/every/share/man/man1/every.1"
          test -f "$HOME/opt/every/share/zsh/site-functions/_every"
          test -f "$HOME/.local/share/bash-completion/completions/every"
          test -f "$HOME/.config/fish/completions/every.fish"
      - name: Re-install over itself (upgrade path)
        run: |
          set -eux
          sh install.sh --prefix "$HOME/opt/every"
          "$HOME/opt/every/bin/every" version
      - name: Uninstall leaves nothing behind
        run: |
          set -eux
          sh install.sh --uninstall --prefix "$HOME/opt/every"
          test ! -e "$HOME/opt/every/lib/every"
          test ! -e "$HOME/opt/every/bin/every"
          test ! -e "$HOME/opt/every/share/man/man1/every.1"
          test ! -e "$HOME/.local/share/bash-completion/completions/every"
          test ! -e "$HOME/.config/fish/completions/every.fish"
      # The `curl … | sh` path: piped, so there's no checkout to install from —
      # the script has to resolve the latest release and download it. Installs
      # that release, not this commit.
      - name: Piped install (download path)
        run: |
          set -eux
          cat install.sh | sh -s -- --prefix "$HOME/opt/piped"
          "$HOME/opt/piped/bin/every" version
      # An explicit --version must beat the checkout sitting right there.
      - name: Pinned version wins over the local tree
        run: |
          set -eux
          sh install.sh --prefix "$HOME/opt/pinned" --version 0.1.3
          "$HOME/opt/pinned/bin/every" version | grep -q "every 0.1.3"
      # A prefix the user can't write to must fail with advice, not a stack of
      # cp errors and a half-install.
      - name: Unwritable prefix fails cleanly
        run: |
          set -eu
          mkdir -p "$HOME/readonly"
          chmod 500 "$HOME/readonly"
          if sh install.sh --prefix "$HOME/readonly/every" >out.txt 2>&1; then
            echo "expected the install to fail"; cat out.txt; exit 1
          fi
          cat out.txt
          grep -q "sudo" out.txt
          test ! -e "$HOME/readonly/every"
